# Staging interno/development/acceptance: solo Docker Desktop con motor Linux en esta máquina.
# Mantener el nombre para conservar los volúmenes locales existentes.
name: meta-ai-game-platform

services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meta_game}
      POSTGRES_USER: ${POSTGRES_USER:-meta_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-postgres-password-change-me-2026}
    ports:
      - name: postgres-loopback
        target: 5432
        published: "${POSTGRES_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - control

  redis:
    image: docker.io/library/redis:8.10.2-alpine3.23@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - name: redis-loopback
        target: 6379
        published: "${REDIS_PORT:-6379}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - control

  mailpit:
    image: docker.io/axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    restart: unless-stopped
    ports:
      - name: mailpit-smtp-loopback
        target: 1025
        published: "${MAILPIT_SMTP_PORT:-1025}"
        host_ip: 127.0.0.1
        protocol: tcp
      - name: mailpit-ui-loopback
        target: 8025
        published: "${MAILPIT_UI_PORT:-8025}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - control

  s3:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meta_game_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-s3-password-change-me-2026}
    ports:
      - name: s3-api-loopback
        target: 9000
        published: "${S3_API_PORT:-9000}"
        host_ip: 127.0.0.1
        protocol: tcp
      - name: s3-console-loopback
        target: 9001
        published: "${S3_CONSOLE_PORT:-9001}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - s3-data:/data
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    networks:
      - control

  web:
    profiles: [web]
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    init: true
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meta_game}:${POSTGRES_PASSWORD:-local-only-postgres-password-change-me-2026}@postgres:5432/${POSTGRES_DB:-meta_game}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-random-32-byte-secret}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Forja Local <no-reply@localhost>}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-2592000}
      PREVIEW_GATEWAY_ENABLED: ${PREVIEW_GATEWAY_ENABLED:-false}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost}
      PREVIEW_TOKEN_KEY_ID: ${PREVIEW_TOKEN_KEY_ID:-replace-with-active-key-id}
      PREVIEW_TOKEN_PRIVATE_KEY: ${PREVIEW_TOKEN_PRIVATE_KEY:-replace-with-base64-pkcs8-rsa-private-key}
      PREVIEW_TOKEN_PUBLIC_KEYS: ${PREVIEW_TOKEN_PUBLIC_KEYS:-replace-with-json-public-keys}
      PREVIEW_TOKEN_TTL_SECONDS: ${PREVIEW_TOKEN_TTL_SECONDS:-60}
      PREVIEW_SESSION_TTL_SECONDS: ${PREVIEW_SESSION_TTL_SECONDS:-900}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-games.localhost}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://worker:8082}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-placeholder-generate-a-separate-random-token}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - name: web-loopback
        target: 3000
        published: "3000"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ../apps/web/app:/workspace/apps/web/app
      - ../apps/web/components:/workspace/apps/web/components
      - ../apps/web/server:/workspace/apps/web/server
      - ../apps/web/styles:/workspace/apps/web/styles
      - ../apps/web/next.config.ts:/workspace/apps/web/next.config.ts:ro
      - ../apps/web/package.json:/workspace/apps/web/package.json:ro
      - ../apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
      - ../packages/config/src:/workspace/packages/config/src
      - ../packages/config/package.json:/workspace/packages/config/package.json:ro
      - ../packages/contracts/src:/workspace/packages/contracts/src
      - ../packages/contracts/package.json:/workspace/packages/contracts/package.json:ro
      - ../package.json:/workspace/package.json:ro
      - ../package-lock.json:/workspace/package-lock.json:ro
      - ../.npmrc:/workspace/.npmrc:ro
      - ../tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ../scripts/check-node-version.mjs:/workspace/scripts/check-node-version.mjs:ro
      - web-node-modules:/workspace/node_modules
      - web-next-cache:/workspace/apps/web/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - control

  worker:
    profiles: [worker]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meta_game}:${POSTGRES_PASSWORD:-local-only-postgres-password-change-me-2026}@postgres:5432/${POSTGRES_DB:-meta_game}
      REDIS_URL: redis://redis:6379
      RUNS_ENABLED: ${RUNS_ENABLED:-false}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      USER_MAX_CONCURRENT_JOBS: ${USER_MAX_CONCURRENT_JOBS:-1}
      PROJECT_MAX_RUN_STEPS: ${PROJECT_MAX_RUN_STEPS:-20}
      RUN_MAX_TOKENS: ${RUN_MAX_TOKENS:-16000}
      USER_DAILY_TOKEN_LIMIT: ${USER_DAILY_TOKEN_LIMIT:-100000}
      USER_DAILY_IMAGE_LIMIT: ${USER_DAILY_IMAGE_LIMIT:-10}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-meta-game-private}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-meta-game-public}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-meta_game_local}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-only-s3-password-change-me-2026}
      PUBLISH_S3_ACCESS_KEY_ID: ${PUBLISH_S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-meta_game_local}}
      PUBLISH_S3_SECRET_ACCESS_KEY: ${PUBLISH_S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-local-only-s3-password-change-me-2026}}
      SNAPSHOT_MAX_FILES: ${SNAPSHOT_MAX_FILES:-512}
      SNAPSHOT_MAX_FILE_BYTES: ${SNAPSHOT_MAX_FILE_BYTES:-8388608}
      SNAPSHOT_MAX_TOTAL_BYTES: ${SNAPSHOT_MAX_TOTAL_BYTES:-20971520}
      SNAPSHOT_MAX_ARCHIVE_BYTES: ${SNAPSHOT_MAX_ARCHIVE_BYTES:-26214400}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-placeholder-generate-a-separate-random-token}
      WORKER_INTERNAL_PORT: ${WORKER_INTERNAL_PORT:-8082}
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-games.localhost}
      SANDBOX_DRIVER: ${SANDBOX_DRIVER:-disabled}
      SANDBOX_CONTROLLER_URL: ${SANDBOX_CONTROLLER_URL:-https://sandbox-controller.example.internal:8443}
      SANDBOX_CONTROLLER_TOKEN: ${SANDBOX_CONTROLLER_TOKEN:-placeholder-generate-a-random-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    networks:
      - control

  publishing-origin:
    profiles: [publishing]
    build:
      context: ..
      dockerfile: infra/publishing-origin.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      PUBLISHING_ORIGIN_PORT: ${PUBLISHING_ORIGIN_PORT:-8083}
      PUBLISH_BASE_DOMAIN: ${PUBLISH_BASE_DOMAIN:-games.localhost}
      PUBLISH_READ_DATABASE_URL: ${PUBLISH_READ_DATABASE_URL:-postgresql://${POSTGRES_USER:-meta_game}:${POSTGRES_PASSWORD:-local-only-postgres-password-change-me-2026}@postgres:5432/${POSTGRES_DB:-meta_game}}
      S3_ENDPOINT: http://s3:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-meta-game-public}
      PUBLISH_READ_ACCESS_KEY_ID: ${PUBLISH_READ_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-meta_game_local}}
      PUBLISH_READ_SECRET_ACCESS_KEY: ${PUBLISH_READ_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-local-only-s3-password-change-me-2026}}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    networks:
      - control

  preview-gateway:
    profiles: [preview]
    build:
      context: ..
      dockerfile: infra/preview-gateway.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meta_game}:${POSTGRES_PASSWORD:-local-only-postgres-password-change-me-2026}@postgres:5432/${POSTGRES_DB:-meta_game}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-preview.localhost}
      PREVIEW_GATEWAY_ENABLED: ${PREVIEW_GATEWAY_ENABLED:-false}
      PREVIEW_TOKEN_PUBLIC_KEYS: ${PREVIEW_TOKEN_PUBLIC_KEYS:-replace-with-json-public-keys}
      PREVIEW_TOKEN_TTL_SECONDS: ${PREVIEW_TOKEN_TTL_SECONDS:-60}
      PREVIEW_SESSION_TTL_SECONDS: ${PREVIEW_SESSION_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    networks:
      - control
      - sandbox-egress

  security-sandbox-image:
    profiles: [security]
    image: meta-game-sandbox:security
    build:
      context: ..
      dockerfile: infra/sandbox/Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none

  security-runner:
    profiles: [security]
    build:
      context: ..
      dockerfile: infra/security-runner.Dockerfile
    init: true
    restart: "no"
    environment:
      SECURITY_TEST_ENABLED: "true"
      SECURITY_TEST_DISPOSABLE_HOST: "1"
      SECURITY_TEST_COMPOSE_RUNNER: "true"
      SANDBOX_DRIVER: rootless
      SANDBOX_IMAGE: meta-game-sandbox:security
      SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_CPU_LIMIT: "1"
      SANDBOX_MEMORY_MB: "1024"
      SANDBOX_DISK_MB: "2048"
      SANDBOX_PIDS_LIMIT: "128"
      SANDBOX_COMMAND_TIMEOUT_MS: "60000"
      SANDBOX_EGRESS_ALLOWLIST: registry.npmjs.org
    volumes:
      # Este runner es de confianza y existe solo para tests hostiles; los sandboxes hijos nunca montan el socket.
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    network_mode: none

  local-router:
    profiles: [local-domains]
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - name: local-https-loopback
        target: 443
        published: "443"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 64
    networks:
      - control

volumes:
  postgres-data:
  redis-data:
  s3-data:
  web-node-modules:
  web-next-cache:
  caddy-data:
  caddy-config:

networks:
  control: {}
  sandbox-egress:
    name: mg-sandbox-egress
    external: true
